<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>BMCAgent</title><link rel="stylesheet" href="/workbench.css"><script src="/task_management_ui.js" defer></script><script src="/plan_matrix.js" defer></script><script src="/project_information_ui.js" defer></script><script src="/workbench.js" defer></script><script src="/zh.js" defer></script></head>
<body class="global-page">
<a class="skip" href="#workspace">Skip to workspace</a>
<div class="app-shell"><aside id="navigator" aria-label="Main navigation"><div class="brand" aria-label="BMCAgent"><span class="brand-mark" aria-hidden="true">B</span><span class="sidebar-label">BMCAgent</span></div><div id="navigation-content"></div><div class="sidebar-preferences"><button type="button" id="language-toggle" aria-label="切換為英文">English</button><button class="icon-button" id="theme-toggle" aria-label="Switch color theme"></button></div></aside><main id="workspace" tabindex="-1" aria-busy="true"><div class="loading">Loading workspace…</div></main></div>
<dialog id="plan-create-dialog" aria-labelledby="plan-create-title"><form id="plan-create-form"><h2 id="plan-create-title">Create Test Plan</h2><div id="plan-create-sku-field" hidden><label class="field"><span>SKU name</span><select name="sku_id" id="plan-create-sku" disabled></select></label></div><label class="field"><span>Plan name</span><input name="name" id="plan-create-name" required maxlength="100" autocomplete="off"></label><p id="plan-create-error" class="plan-create-error" role="alert"></p><div class="actions"><button type="submit" class="primary">Create</button><button type="button" data-action="cancel-create-plan">Cancel</button></div></form></dialog>
<dialog id="import-conflict-dialog" aria-labelledby="import-conflict-title"><form id="import-conflict-form"><h2 id="import-conflict-title" data-no-translate>Case Conflicts</h2><div id="import-conflict-items"></div></form></dialog>
<dialog id="plan-import-dialog" aria-labelledby="plan-import-title"><form id="plan-import-form"><h2 id="plan-import-title">Import Test Case</h2><label class="field"><span>Where should Test Cases be imported from?</span><select id="plan-import-source" required></select></label><p id="plan-import-error" role="alert"></p><div class="actions"><button type="submit" class="primary">Continue</button><button type="button" data-action="cancel-import-source">Cancel</button></div></form></dialog>
<input id="repository-file-picker" type="file" accept=".py" hidden>
<dialog id="repository-create-folder-dialog" aria-labelledby="repository-create-folder-title"><form id="repository-create-folder-form"><h2 id="repository-create-folder-title">New folder</h2><label class="field"><span>Enter a new folder name</span><input name="name" id="repository-create-folder-name" required maxlength="100" autocomplete="off"></label><p id="repository-create-folder-error" class="plan-create-error" role="alert"></p><div class="actions"><button type="submit" class="primary">Create</button><button type="button" data-action="cancel-repository-folder">Cancel</button></div></form></dialog>
<div id="notifications" aria-live="polite" aria-atomic="true"></div>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title">Confirm action</h2><p id="confirm-message"></p><div class="actions"><button value="confirm" class="danger">Delete</button><button value="cancel">Cancel</button></div></form></dialog>
</body></html>
